<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تقنية المعلومات التفاعلي الشامل</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --correct-bg: #d1fae5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary);
            font-size: 2em;
        }
        header p {
            color: #6b7280;
            font-size: 1.1em;
            margin-top: 5px;
        }
        .question-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            direction: ltr; /* الأسئلة بالإنجليزية */
            text-align: left;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }
        .question-title {
            font-size: 1.25em;
            font-weight: 600;
            color: #111827;
            margin: 0;
            flex-grow: 1;
        }
        .retry-btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.9em;
            font-weight: bold;
            display: none; /* مخفي افتراضياً */
            transition: 0.2s;
            white-space: nowrap;
        }
        .retry-btn:hover {
            background-color: #d97706;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05em;
            transition: all 0.2s ease;
            background-color: #f9fafb;
        }
        .option:hover {
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }
        .option.disabled {
            pointer-events: none;
        }
        .option.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: bold;
        }
        .option.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
            font-weight: bold;
        }
        .explanation {
            margin-top: 16px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            direction: rtl; /* الشرح بالعربية */
            text-align: right;
            font-size: 1.1em;
            animation: fadeIn 0.4s;
        }
        .explanation.show {
            display: block;
        }
        .exp-correct {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border-right: 5px solid var(--correct-border);
        }
        .exp-wrong {
            background-color: var(--wrong-bg);
            color: var(--wrong-text);
            border-right: 5px solid var(--wrong-border);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>اختبار تقنية المعلومات الشامل</h1>
            <p>يحتوي على 120 سؤال - اختر الإجابة لتصحيحها فوراً</p>
        </header>
        
        <div id="quiz-container"></div>
    </div>

            { q: "Physical topology shows", opts: ["Data flow", "IP addresses", "Actual layout of devices", "Programs"], ans: "Actual layout of devices" },
            // المجموعة 19
            { q: "Logical topology shows", opts: ["Cables only", "Device shape", "Data flow and relationships", "Hardware damage"], ans: "Data flow and relationships" },

            { q: "TCP/IP is", opts: ["Hardware", "Network cable", "Communication protocol", "Storage system"], ans: "Communication protocol" },
            
            // الدفعة الجديدة (40 سؤال)
            { q: "What is a network protocol", opts: ["A set of rules governing data transmission", "A hardware device used for communication", "A type of network cable", "A programming language"], ans: "A set of rules governing data transmission" },
            { q: "Which component is NOT part of a protocol", opts: ["Format", "Order", "Action", "Bandwidth"], ans: "Bandwidth" },
            { q: "What happens if two devices use different message formats", opts: ["Data is compressed", "Communication fails", "Speed increases", "Encryption is enabled"], ans: "Communication fails" },
            { q: "The network edge includes", opts: ["Routers and backbone links", "End systems like laptops and servers", "Only switches", "Fiber cables only"], ans: "End systems like laptops and servers" },
            { q: "The network core is responsible for", opts: ["Running applications", "User interaction", "Forwarding data across networks", "Generating packets"], ans: "Forwarding data across networks" },

            { q: "Which layer is responsible for user-facing applications", opts: ["Application", "Transport", "Network", "Physical"], ans: "Application" },
            { q: "Which protocol is used for web communication", opts: ["FTP", "SMTP", "HTTP", "DNS"], ans: "HTTP" },
            { q: "Which transport protocol is connection-oriented", opts: ["UDP", "TCP", "IP", "HTTP"], ans: "TCP" },

        ];

        const container = document.getElementById('quiz-container');

        quizData.forEach((item, index) => {
            // إنشاء كرت السؤال
            const card = document.createElement('div');
            card.className = 'question-card';

            // حاوية لعنوان السؤال وزر الإعادة لتكون بجانب بعضها
            const headerDiv = document.createElement('div');
            headerDiv.className = 'question-header';

            // عنوان السؤال
            const title = document.createElement('div');
            title.className = 'question-title';
            title.innerText = `${index + 1}. ${item.q}`;
            
            // زر إعادة المحاولة (مخفي افتراضياً)
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-btn';
            retryBtn.innerHTML = '🔄 إعادة المحاولة';

            headerDiv.appendChild(title);
            headerDiv.appendChild(retryBtn);
            card.appendChild(headerDiv);

            // حاوية الخيارات
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            // مربع الشرح
            const explanation = document.createElement('div');
            explanation.className = 'explanation';

            // برمجة زر الإعادة
            retryBtn.onclick = () => {
                // إزالة الألوان والقفل من جميع الخيارات
                Array.from(optionsContainer.children).forEach(child => {
                    child.classList.remove('disabled', 'correct', 'wrong');
                });
                // إخفاء الشرح
                explanation.classList.remove('show', 'exp-correct', 'exp-wrong');
                // إخفاء زر الإعادة نفسه
                retryBtn.style.display = 'none';
            };

            // إنشاء الخيارات
            item.opts.forEach(opt => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerText = opt;

                // وظيفة عند الضغط على الإجابة
                optionDiv.onclick = () => {
                    // قفل جميع الخيارات حتى لا تتغير
                    Array.from(optionsContainer.children).forEach(child => {
                        child.classList.add('disabled');
                        // تلوين الإجابة الصحيحة
                        if (child.innerText === item.ans) {
                            child.classList.add('correct');
                        }
                    });

                    // التحقق من الإجابة
                    if (opt === item.ans) {
