<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تقنية المعلومات التفاعلي</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --correct-bg: #d1fae5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary);
            font-size: 2em;
        }
        header p {
            color: #6b7280;
            font-size: 1.1em;
        }
        .question-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            direction: ltr; /* الأسئلة بالإنجليزية */
            text-align: left;
        }
        .question-title {
            font-size: 1.25em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #111827;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05em;
            transition: all 0.2s ease;
            background-color: #f9fafb;
        }
        .option:hover {
            background-color: #f3f4f6;
            border-color: #d1d5db;
        }
        .option.disabled {
            pointer-events: none;
        }
        .option.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: bold;
        }
        .option.wrong {
            background-color: var(--wrong-bg);
            border-color: var(--wrong-border);
            color: var(--wrong-text);
            font-weight: bold;
        }
        .explanation {
            margin-top: 16px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            direction: rtl; /* الشرح بالعربية */
            text-align: right;
            font-size: 1.1em;
            animation: fadeIn 0.4s;
        }
        .explanation.show {
            display: block;
        }
        .exp-correct {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border-right: 5px solid var(--correct-border);
        }
        .exp-wrong {
            background-color: var(--wrong-bg);
            color: var(--wrong-text);
            border-right: 5px solid var(--wrong-border);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>اختبار تقنية المعلومات الشامل</h1>
            <p>اختر الإجابة لتصحيحها فوراً (80 سؤال)</p>
        </header>
        
        <div id="quiz-container"></div>
    </div>

    <script>
        // جميع الأسئلة الـ 80
        const quizData = [
            // المجموعة 1
            { q: "Which type of computer is the most powerful?", opts: ["PC", "Server", "Mainframe", "Supercomputer"], ans: "Supercomputer" },
            { q: "A washing machine controller is an example of", opts: ["General-purpose computer", "Personal computer", "Special-purpose computer", "Server"], ans: "Special-purpose computer" },
            { q: "Which IT professional is responsible for protecting systems from cyber threats", opts: ["Web Developer", "Software Developer", "Security Specialist", "Database Administrator"], ans: "Security Specialist" },
            { q: "Which skill is essential for IT professionals due to rapid technology changes", opts: ["Problem solving", "Communication", "Lifelong learning", "Teamwork"], ans: "Lifelong learning" },
            { q: "Which of the following is a network device", opts: ["Router", "Printer", "Monitor", "Scanner"], ans: "Router" },
            // المجموعة 2
            { q: "Which of the following is an example of storage", opts: ["Monitor", "SSD", "CPU", "Keyboard"], ans: "SSD" },
            { q: "Software is defined as", opts: ["Physical parts of a computer", "Internet services", "Programs and instructions that tell a computer what to do", "Computer users"], ans: "Programs and instructions that tell a computer what to do" },
            { q: "Which type of software manages hardware and provides a platform for applications", opts: ["Application software", "Educational software", "System software", "Multimedia software"], ans: "System software" },
            { q: "Microsoft Word is an example of", opts: ["System software", "Utility software", "Application software", "Network software"], ans: "Application software" },
            { q: "A computer network is used mainly to", opts: ["Increase computer speed", "Share information and resources", "Store data only", "Repair computers"], ans: "Share information and resources" },
            // المجموعة 3
            { q: "Which stage of the IPOS cycle involves entering data into the computer", opts: ["Processing", "Storage", "Output", "Input"], ans: "Input" },
            { q: "Which device is considered an input device", opts: ["Monitor", "Printer", "Keyboard", "Speaker"], ans: "Keyboard" },
            { q: "Which component performs processing in a computer system", opts: ["RAM", "CPU", "Hard disk", "Monitor"], ans: "CPU" },
            { q: "Which of the following is an output device", opts: ["Scanner", "Mouse", "Speaker", "Keyboard"], ans: "Speaker" },
            { q: "Saving data for future use is called:", opts: ["Processing", "Output", "Input", "Storage"], ans: "Storage" },
            // المجموعة 4
            { q: "What does Information Technology (IT) refer to", opts: ["Only computer programming", "Using computers, systems, data, and people to manage information", "Repairing computer hardware", "Using the Internet for entertainment"], ans: "Using computers, systems, data, and people to manage information" },
            { q: "Which of the following is NOT a meaning of IT", opts: ["Careers that use computers", "Computer systems and components", "IT staff", "Computer games"], ans: "Computer games" },
            { q: "A computer system is best defined as", opts: ["A single computer device", "A collection of software only", "A complete set of components working together to process information", "A network connection"], ans: "A complete set of components working together to process information" },
            { q: "Which component of a computer system refers to physical parts you can touch", opts: ["Software", "Data", "Hardware", "Users"], ans: "Hardware" },
            { q: "What does IPOS stand for", opts: ["Internet, Processing, Output, System", "Input, Processing, Output, Storage", "Information, Program, Output, Software", "Input, Program, Operating system, Storage"], ans: "Input, Processing, Output, Storage" },
            // المجموعة 5
            { q: "Registers are", opts: ["Large and slow memory units", "External storage devices", "Very fast, small memory inside the CPU", "Network components"], ans: "Very fast, small memory inside the CPU" },
            { q: "The correct order of the instruction cycle is", opts: ["Decode – Fetch – Execute – Store", "Fetch – Decode – Execute – Store", "Execute – Fetch – Store – Decode", "Store – Execute – Decode – Fetch"], ans: "Fetch – Decode – Execute – Store" },
            { q: "In the instruction cycle, the ALU mainly works during which stage", opts: ["Fetch", "Decode", "Execute", "Store"], ans: "Execute" },
            { q: "Memory hierarchy is organized based on", opts: ["Color and shape", "Brand and manufacturer", "Speed and size", "Power consumption only"], ans: "Speed and size" },
            // المجموعة 6
            { q: "Which is the fastest memory type", opts: ["Secondary storage", "RAM", "Cache", "Registers"], ans: "Registers" },
            { q: "The system bus is best described as", opts: ["A cooling system", "A communication path between components", "A power cable", "A storage device"], ans: "A communication path between components" },
            { q: "The data bus is responsible for", opts: ["Carrying control signals", "Carrying memory addresses", "Transferring actual data", "Managing power supply"], ans: "Transferring actual data" },
            { q: "The address bus carries", opts: ["User passwords", "Memory addresses", "Control instructions", "Graphic data only"], ans: "Memory addresses" },
            // المجموعة 7
            { q: "The control bus sends signals such as", opts: ["Numbers and images", "Read and write commands", "Memory capacity", "File names"], ans: "Read and write commands" },
            { q: "A single-core CPU can", opts: ["Perform unlimited tasks simultaneously", "Execute only one task at a time", "Replace RAM", "Eliminate storage"], ans: "Execute only one task at a time" },
            { q: "Multi-core architecture improves performance mainly by", opts: ["Increasing monitor size", "Reducing storage capacity", "Allowing multiple tasks to run simultaneously", "Removing the control unit"], ans: "Allowing multiple tasks to run simultaneously" },
            { q: "Increasing the number of CPU cores generally leads to", opts: ["Slower system performance", "Reduced multitasking capability", "Better multitasking and smoother performance", "Removal of instruction cycles"], ans: "Better multitasking and smoother performance" },
            // المجموعة 8
            { q: "What is system architecture", opts: ["A type of operating system", "The overall design of a computer system", "A programming language", "A storage device"], ans: "The overall design of a computer system" },
            { q: "System architecture describes all of the following EXCEPT", opts: ["System components", "Functions of each component", "Communication between components", "Internet connection speed"], ans: "Internet connection speed" },
            { q: "One main reason to study system architecture is to", opts: ["Replace hardware daily", "Improve performance and efficiency", "Avoid using software", "Eliminate memory usage"], ans: "Improve performance and efficiency" },
            { q: "Which of the following is NOT a main component of a computer system", opts: ["CPU", "Memory", "Compiler", "Storage"], ans: "Compiler" },
            // المجموعة 9
            { q: "The CPU is commonly described as", opts: ["The storage unit", "The brain of the computer", "The input device", "The power supply"], ans: "The brain of the computer" },
            { q: "RAM is considered volatile because", opts: ["It is very slow", "It stores data permanently", "Data is lost when power is off", "It cannot store programs"], ans: "Data is lost when power is off" },
            { q: "Which component stores data permanently", opts: ["Registers", "Cache", "RAM", "Secondary storage"], ans: "Secondary storage" },
            { q: "The Arithmetic Logic Unit (ALU) is responsible for", opts: ["Controlling input devices", "Performing calculations", "Managing storage devices", "Displaying output"], ans: "Performing calculations" },
            // المجموعة 10
            { q: "?What is an operating system", opts: ["A hardware component", "System software that manages hardware", "A programming language", "A network device"], ans: "System software that manages hardware" },
            { q: "The OS acts as", opts: ["Storage device", "Interface between user and hardware", "Antivirus", "Firewall"], ans: "Interface between user and hardware" },
            { q: "The kernel is", opts: ["External software", "The central part of the OS", "A user application", "A network tool"], ans: "The central part of the OS" },
            { q: "The kernel has", opts: ["Limited access", "No control", "Full hardware privileges", "Internet access only"], ans: "Full hardware privileges" },
            // المجموعة 11
            { q: "A process is", opts: ["Hardware device", "File system", "Network connection", "Program in execution"], ans: "Program in execution" },
            { q: "?Which is NOT a process state", opts: ["Ready", "Running", "Waiting", "Installed"], ans: "Installed" },
            { q: "Multitasking means", opts: ["Multiple programs running seemingly at once", "One program at a time", "No programs", "Only background tasks"], ans: "Multiple programs running seemingly at once" },
            { q: "Memory management is responsible for", opts: ["Internet speed", "Allocating memory to processes", "Printing files", "Deleting data"], ans: "Allocating memory to processes" },
            // المجموعة 12
            { q: "Resource management controls", opts: ["Only memory", "Only CPU", "CPU, storage, and I/O", "Internet only"], ans: "CPU, storage, and I/O" },
            { q: "Protection and security ensure", opts: ["Faster CPU", "No crashes", "Authorized access only", "More storage"], ans: "Authorized access only" },
            { q: "Interrupts are", opts: ["Errors", "Signals to the OS", "Files", "Programs"], ans: "Signals to the OS" },
            { q: "When an interrupt occurs, the OS", opts: ["Shuts down", "Ignores it", "Pauses current process", "Deletes data"], ans: "Pauses current process" },
            // المجموعة 13
            { q: "Single-tasking means", opts: ["Many processes", "One process at a time", "No processes", "Background tasks"], ans: "One process at a time" },
            { q: "Batch processing", opts: ["Runs jobs together without interruption", "Allows interaction", "Runs one task forever", "Uses internet only"], ans: "Runs jobs together without interruption" },
            { q: "Concurrent processing", opts: ["One task only", "Tasks overlap in execution", "No CPU use", "Only offline tasks"], ans: "Tasks overlap in execution" },
            { q: "Multiprogramming", opts: ["One program in memory", "No programs", "Multiple programs in memory", "Only games"], ans: "Multiple programs in memory" },
            // المجموعة 14
            { q: "Multithreading", opts: ["Multiple CPUs", "Multiple threads in one process", "One thread only", "No execution"], ans: "Multiple threads in one process" },
            { q: "Multiprocessing uses", opts: ["Multiple CPUs or cores", "One CPU", "No CPU", "RAM only"], ans: "Multiple CPUs or cores" },
            { q: "Device drivers", opts: ["Hardware devices", "Network cables", "Security tools", "Translate OS commands to hardware"], ans: "Translate OS commands to hardware" },
            { q: "Booting is", opts: ["Starting the system and loading OS", "Deleting files", "Installing apps", "Running programs"], ans: "Starting the system and loading OS" },
            // المجموعة 15
            { q: "?What is a computer network", opts: ["A single computer", "A group of connected computers and resources", "A storage device", "A software program"], ans: "A group of connected computers and resources" },
            { q: "The main purpose of a network is", opts: ["Communication and resource sharing", "Gaming", "Printing only", "Programming"], ans: "Communication and resource sharing" },
            { q: "Which is a network benefit", opts: ["No cost", "Sharing data and hardware", "Slower performance", "No security"], ans: "Sharing data and hardware" },
            { q: "A local computer is", opts: ["Computer used physically by the user", "Remote device", "Server", "Cloud system"], ans: "Computer used physically by the user" },
            // المجموعة 16
            { q: "A remote computer is accessed using", opts: ["USB", "Bluetooth only", "Remote Desktop, SSH, Telnet", "Printer"], ans: "Remote Desktop, SSH, Telnet" },
            { q: "The physical level includes", opts: ["Protocols", "Topology", "Hardware and cables", "Software"], ans: "Hardware and cables" },
            { q: "The logical level focuses on", opts: ["Hardware", "Structure and topology", "Users", "Storage"], ans: "Structure and topology" },
            { q: "The software level includes", opts: ["Switches", "Routers", "Protocols and programs", "Cables"], ans: "Protocols and programs" },
            // المجموعة 17
            { q: "Bandwidth refers to", opts: ["Distance", "Transfer rate of data", "Device size", "CPU speed"], ans: "Transfer rate of data" },
            { q: "A hub", opts: ["Connects networks", "Connects multiple computers", "Routes packets", "Stores data"], ans: "Connects multiple computers" },
            { q: "A switch uses", opts: ["MAC addresses", "IP addresses", "Ports only", "Files"], ans: "MAC addresses" },
            { q: "A router", opts: ["Connects computers", "Connects multiple networks", "Stores data", "Encrypts data"], ans: "Connects multiple networks" },
            // المجموعة 18
            { q: "A gateway", opts: ["Connects same networks", "Stores files", "Connects different types of networks", "Speeds internet"], ans: "Connects different types of networks" },
            { q: "Network mapping is", opts: ["Programming", "Visual representation of a network", "Security tool", "Storage method"], ans: "Visual representation of a network" },
            { q: "Which is a step in network mapping", opts: ["Coding", "Data collection", "Deleting files", "Formatting disk"], ans: "Data collection" },
            { q: "Physical topology shows", opts: ["Data flow", "IP addresses", "Actual layout of devices", "Programs"], ans: "Actual layout of devices" },
            // المجموعة 19
            { q: "Logical topology shows", opts: ["Cables only", "Device shape", "Data flow and relationships", "Hardware damage"], ans: "Data flow and relationships" },
            { q: "Which network is the smallest", opts: ["WAN", "MAN", "LAN", "PAN"], ans: "PAN" },
            { q: "In Client–Server", opts: ["All devices equal", "Clients respond", "Servers respond to requests", "No communication"], ans: "Servers respond to requests" },
            { q: "TCP/IP is", opts: ["Hardware", "Network cable", "Communication protocol", "Storage system"], ans: "Communication protocol" }
        ];

        const container = document.getElementById('quiz-container');

        quizData.forEach((item, index) => {
            // إنشاء كرت السؤال
            const card = document.createElement('div');
            card.className = 'question-card';

            // عنوان السؤال
            const title = document.createElement('div');
            title.className = 'question-title';
            title.innerText = `${index + 1}. ${item.q}`;
            card.appendChild(title);

            // حاوية الخيارات
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            // مربع الشرح
            const explanation = document.createElement('div');
            explanation.className = 'explanation';

            // إنشاء الخيارات
            item.opts.forEach(opt => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerText = opt;

                // وظيفة عند الضغط على الإجابة
                optionDiv.onclick = () => {
                    // تعطيل جميع الخيارات لهذا السؤال حتى لا يتغير
                    Array.from(optionsContainer.children).forEach(child => {
                        child.classList.add('disabled');
                        // تلوين الإجابة الصحيحة دائماً حتى لو أخطأ الطالب
                        if (child.innerText === item.ans) {
                            child.classList.add('correct');
                        }
                    });

                    // التحقق من الإجابة
                    if (opt === item.ans) {
                        // إجابة صحيحة
                        explanation.classList.add('show', 'exp-correct');
                        explanation.innerHTML = `✅ <strong>إجابة صحيحة!</strong> أحسنت، الخيار (${opt}) هو الإجابة المطلوبة.`;
                    } else {
                        // إجابة خاطئة
                        optionDiv.classList.add('wrong'); // تلوين اختيار الطالب بالأحمر
                        explanation.classList.add('show', 'exp-wrong');
                        explanation.innerHTML = `❌ <strong>إجابة خاطئة!</strong> الإجابة الصحيحة هي: (${item.ans}).`;
                    }
                };
                optionsContainer.appendChild(optionDiv);
            });

            card.appendChild(optionsContainer);
            card.appendChild(explanation);
            container.appendChild(card);
        });
    </script>
</body>
</html>
