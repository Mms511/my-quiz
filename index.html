<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار تقنية المعلومات التفاعلي الشامل</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --title-color: #111827;
            --option-bg: #f9fafb;
            --option-border: #e5e7eb;
            --option-hover: #f3f4f6;
            
            --correct-bg: #d1fae5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
        }

        body.dark-mode {
            --bg: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --title-color: #f3f4f6;
            --option-bg: #374151;
            --option-border: #4b5563;
            --option-hover: #4b5563;
            
            --correct-bg: #064e3b;
            --correct-border: #10b981;
            --correct-text: #a7f3d0;
            
            --wrong-bg: #7f1d1d;
            --wrong-border: #ef4444;
            --wrong-text: #fca5a5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .theme-toggle-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        #theme-toggle {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--option-border);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        #theme-toggle:hover {
            border-color: var(--primary);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary);
            font-size: 2em;
        }
        header p {
            color: var(--text-muted);
            font-size: 1.1em;
            margin-top: 5px;
        }
        .question-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 24px;
            direction: ltr; /* الأسئلة بالإنجليزية */
            text-align: left;
            transition: background-color 0.3s;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 15px;
        }
        .question-title {
            font-size: 1.25em;
            font-weight: 600;
            color: var(--title-color);
            margin: 0;
            flex-grow: 1;
        }
        .retry-btn {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            font-weight: bold;
            display: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .retry-btn:hover {
            background-color: #d97706;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 14px 16px;
            border: 2px solid var(--option-border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.05em;
            transition: all 0.2s ease;
            background-color: var(--option-bg);
            color: var(--text-main);
        }
        .option:hover {
            background-color: var(--option-hover);
            border-color: #9ca3af;
        }
        .option.disabled {
            pointer-events: none;
        }
        .option.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: bold;
        }
        .option.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
            font-weight: bold;
        }
        
        .explanation {
            margin-top: 16px;
            padding: 16px;
            border-radius: 8px;
            display: none;
            font-size: 1.05em;
            animation: fadeIn 0.4s;
            line-height: 1.6;
        }
        .explanation.show {
            display: block;
        }
        .exp-correct {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border-left: 5px solid var(--correct-border);
        }
        .exp-wrong {
            background-color: var(--wrong-bg);
            color: var(--wrong-text);
            border-left: 5px solid var(--wrong-border);
        }
        .exp-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }
        .exp-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .exp-ar {
            direction: rtl;
            text-align: right;
            padding: 8px;
            background-color: rgba(0,0,0,0.03);
            border-radius: 6px;
        }
        .exp-en {
            direction: ltr;
            text-align: left;
            padding: 8px;
            background-color: rgba(0,0,0,0.03);
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }
        body.dark-mode .exp-ar, body.dark-mode .exp-en {
            background-color: rgba(255,255,255,0.05);
        }
        body.dark-mode .exp-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- زر الوضع الليلي -->
        <div class="theme-toggle-container">
            <button id="theme-toggle">🌙 الوضع الداكن</button>
        </div>

        <header>
            <h1>اختبار تقنية المعلومات الشامل</h1>
            <p>120 سؤال - شرح بالعربي والإنجليزي لكل سؤال</p>
        </header>
        
        <div id="quiz-container"></div>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if(document.body.classList.contains('dark-mode')) {
                themeBtn.innerHTML = '☀️ الوضع الفاتح';
            } else {
                themeBtn.innerHTML = '🌙 الوضع الداكن';
            }
        });

        // قاعدة بيانات الـ 120 سؤال مع الشرح المزدوج
        const quizData = [
            { q: "Which type of computer is the most powerful?", opts: ["PC", "Server", "Mainframe", "Supercomputer"], ans: "Supercomputer", 
              ar: "الحواسيب الخارقة (Supercomputers) هي الأقوى وتستخدم للعمليات شديدة التعقيد.", 
              en: "Supercomputers are the most powerful and are used for highly complex operations." },
            { q: "A washing machine controller is an example of", opts: ["General-purpose computer", "Personal computer", "Special-purpose computer", "Server"], ans: "Special-purpose computer", 
              ar: "المتحكم في الغسالة مصمم لغرض واحد فقط، لذا يسمى حاسوب خاص الغرض.", 
              en: "A washing machine controller is designed for a single purpose, hence it is a special-purpose computer." },
            { q: "Which IT professional is responsible for protecting systems from cyber threats", opts: ["Web Developer", "Software Developer", "Security Specialist", "Database Administrator"], ans: "Security Specialist", 
              ar: "أخصائي الأمن هو المسؤول المباشر عن الحماية من التهديدات السيبرانية.", 
              en: "A Security Specialist is directly responsible for protection against cyber threats." },
            { q: "Which skill is essential for IT professionals due to rapid technology changes", opts: ["Problem solving", "Communication", "Lifelong learning", "Teamwork"], ans: "Lifelong learning",

              en: "Technology evolves rapidly, making lifelong learning an essential skill." },
            { q: "Which of the following is a network device", opts: ["Router", "Printer", "Monitor", "Scanner"], ans: "Router", 
              ar: "الموجه (Router) هو الجهاز الذي يربط الشبكات ببعضها، البقية أجهزة طرفية.", 
              en: "A Router connects networks together, while the others are peripheral devices." },
            
            { q: "Which of the following is an example of storage", opts: ["Monitor", "SSD", "CPU", "Keyboard"], ans: "SSD", 
              ar: "قرص الحالة الصلبة (SSD) هو وحدة التخزين، بينما البقية معالجة وإدخال/إخراج.",

            { q: "Software is defined as", opts: ["Physical parts of a computer", "Internet services", "Programs and instructions that tell a computer what to do", "Computer users"], ans: "Programs and instructions that tell a computer what to do", 
              ar: "البرمجيات هي التعليمات والأوامر التي توجه المكونات المادية.", 
              en: "Software refers to the programs and instructions that guide the hardware." },
            { q: "Which type of software manages hardware and provides a platform for applications", opts: ["Application software", "Educational software", "System software", "Multimedia software"], ans: "System software",

              en: "System software (like an OS) manages hardware and provides a platform for apps." },
            { q: "Microsoft Word is an example of", opts: ["System software", "Utility software", "Application software", "Network software"], ans: "Application software", 
              ar: "برنامج وورد هو تطبيق صُمم ليؤدي وظيفة معينة للمستخدم.", 
              en: "Word is an application software designed to perform a specific task for the user." },
            { q: "A computer network is used mainly to", opts: ["Increase computer speed", "Share information and resources", "Store data only", "Repair computers"], ans: "Share information and resources", 
              ar: "الهدف الرئيسي للشبكات هو مشاركة البيانات والموارد كالملفات والطابعات.", 
              en: "The main goal of networks is to share data and resources like files and printers." },
            
            { q: "Which stage of the IPOS cycle involves entering data into the computer", opts: ["Processing", "Storage", "Output", "Input"], ans: "Input", 
              ar: "مرحلة الإدخال هي المرحلة التي يتم فيها إدخال البيانات للجهاز.", 
              en: "The Input stage is where data is entered into the system." },
            { q: "Which device is considered an input device", opts: ["Monitor", "Printer", "Keyboard", "Speaker"], ans: "Keyboard", 
              ar: "لوحة المفاتيح تُستخدم للإدخال، البقية هي أجهزة إخراج.", 
              en: "A keyboard is used for input, while the others are output devices." },
            { q: "Which component performs processing in a computer system", opts: ["RAM", "CPU", "Hard disk", "Monitor"], ans: "CPU",

            { q: "Which of the following is an output device", opts: ["Scanner", "Mouse", "Speaker", "Keyboard"], ans: "Speaker",

              en: "Speakers output sound, while mice, scanners, and keyboards are input devices." },
            { q: "Saving data for future use is called:", opts: ["Processing", "Output", "Input", "Storage"], ans: "Storage", 
              ar: "حفظ البيانات لاستخدامها لاحقاً يُسمى التخزين.", 
              en: "Saving data for future use is called Storage." },
            
            { q: "What does Information Technology (IT) refer to", opts: ["Only computer programming", "Using computers, systems, data, and people to manage information", "Repairing computer hardware", "Using the Internet for entertainment"], ans: "Using computers, systems, data, and people to manage information",

            { q: "Which of the following is NOT a meaning of IT", opts: ["Careers that use computers", "Computer systems and components", "IT staff", "Computer games"], ans: "Computer games",

            { q: "Which component of a computer system refers to physical parts you can touch", opts: ["Software", "Data", "Hardware", "Users"], ans: "Hardware", 
              ar: "المكونات المادية (Hardware) هي أي قطعة ملموسة في الحاسب.", 
              en: "Hardware refers to any physical, tangible part of the computer." },
            { q: "What does IPOS stand for", opts: ["Internet, Processing, Output, System", "Input, Processing, Output, Storage", "Information, Program, Output, Software", "Input, Program, Operating system, Storage"], ans: "Input, Processing, Output, Storage",

              en: "The information processing cycle consists of: Input, Processing, Output, and Storage." },
            
            { q: "Registers are", opts: ["Large and slow memory units", "External storage devices", "Very fast, small memory inside the CPU", "Network components"], ans: "Very fast, small memory inside the CPU",

              en: "Registers are very small, extremely fast memory units located inside the CPU." },
            { q: "The correct order of the instruction cycle is", opts: ["Decode – Fetch – Execute – Store", "Fetch – Decode – Execute – Store", "Execute – Fetch – Store – Decode", "Store – Execute – Decode – Fetch"], ans: "Fetch – Decode – Execute – Store", 
              ar: "الدورة تبدأ بالجلب، الفك، التنفيذ، ثم التخزين.", 
              en: "The cycle starts with Fetch, then Decode, Execute, and finally Store." },
            { q: "In the instruction cycle, the ALU mainly works during which stage", opts: ["Fetch", "Decode", "Execute", "Store"], ans: "Execute", 
              ar: "وحدة الحساب والمنطق تقوم بالعمليات خلال مرحلة التنفيذ.", 
              en: "The Arithmetic Logic Unit (ALU) performs calculations during the Execute stage." },
            { q: "Memory hierarchy is organized based on", opts: ["Color and shape", "Brand and manufacturer", "Speed and size", "Power consumption only"], ans: "Speed and size", 
              ar: "هرم الذاكرة يعتمد على السرعة والحجم.", 
              en: "The memory hierarchy is based on speed and size." },
            
            { q: "Which is the fastest memory type", opts: ["Secondary storage", "RAM", "Cache", "Registers"], ans: "Registers", 
              ar: "المسجلات هي الأسرع لقربها الشديد من قلب المعالج.", 
              en: "Registers are the absolute fastest memory due to their location inside the CPU core." },
            { q: "The system bus is best described as", opts: ["A cooling system", "A communication path between components", "A power cable", "A storage device"], ans: "A communication path between components", 
              ar: "ناقل النظام هو مسار الاتصال الذي ينقل البيانات بين مكونات اللوحة الأم.", 
              en: "The system bus is the communication pathway that transfers data between motherboard components." },
            { q: "The data bus is responsible for", opts: ["Carrying control signals", "Carrying memory addresses", "Transferring actual data", "Managing power supply"], ans: "Transferring actual data", 
              ar: "ناقل البيانات ينقل البيانات الفعلية، بينما ناقل العناوين ينقل المواقع.",

            { q: "The address bus carries", opts: ["User passwords", "Memory addresses", "Control instructions", "Graphic data only"], ans: "Memory addresses", 
              ar: "ناقل العناوين مخصص لنقل عناوين مواقع الذاكرة المطلوبة.", 
              en: "The address bus is dedicated solely to carrying requested memory addresses." },
            
            { q: "The control bus sends signals such as", opts: ["Numbers and images", "Read and write commands", "Memory capacity", "File names"], ans: "Read and write commands",

            { q: "?What is an operating system", opts: ["A hardware component", "System software that manages hardware", "A programming language", "A network device"], ans: "System software that manages hardware",

            title.className = 'question-title';
            title.innerText = `${index + 1}. ${item.q}`;
            
            // زر إعادة المحاولة
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-btn';
            retryBtn.innerHTML = '🔄 إعادة المحاولة';

            headerDiv.appendChild(title);
            headerDiv.appendChild(retryBtn);
            card.appendChild(headerDiv);

            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'options-container';

            const explanation = document.createElement('div');
            explanation.className = 'explanation';

            // إعادة المحاولة
            retryBtn.onclick = () => {
                Array.from(optionsContainer.children).forEach(child => {
                    child.classList.remove('disabled', 'correct', 'wrong');
                });
                explanation.classList.remove('show', 'exp-correct', 'exp-wrong');
                retryBtn.style.display = 'none';
            };

            // إنشاء الخيارات
            item.opts.forEach(opt => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerText = opt;

                optionDiv.onclick = () => {
                    Array.from(optionsContainer.children).forEach(child => {
                        child.classList.add('disabled');
                        if (child.innerText === item.ans) {
                            child.classList.add('correct');
                        }
                    });

                    const isCorrect = (opt === item.ans);
                    
                    const titleAR = isCorrect ? "✅ إجابة صحيحة!" : "❌ إجابة خاطئة!";
                    const titleEN = isCorrect ? "Correct Answer!" : "Wrong Answer!";
                    
                    // إذا أخطأ، نوضح له الإجابة الصحيحة فوق الشرح
                    const correctAnsText = !isCorrect 
                        ? `<div dir="ltr" style="margin-top: 5px; color: var(--wrong-text);"><strong>Correct Answer:</strong> ${item.ans}</div>
                           <div dir="rtl" style="margin-bottom: 10px; color: var(--wrong-text);"><strong>الإجابة الصحيحة:</strong> ${item.ans}</div>` 
                        : ``;

                    if (isCorrect) {
                        explanation.classList.add('exp-correct');
                    } else {
                        optionDiv.classList.add('wrong'); 
                        explanation.classList.add('exp-wrong');
                    }
                    
                    explanation.classList.add('show');
                    
                    // بناء شكل الشرح من الداخل
                    explanation.innerHTML = `
                        <div class="exp-header">
                            <span dir="ltr">${titleEN}</span>
                            <span dir="rtl">${titleAR}</span>
                        </div>
                        ${correctAnsText}
                        <div class="exp-body">
                            <div class="exp-en"><strong>Explanation:</strong> ${item.en}</div>
                            <div class="exp-ar"><strong>الشرح:</strong> ${item.ar}</div>
                        </div>
                    `;
                    
                    retryBtn.style.display = 'inline-block';
                };
                optionsContainer.appendChild(optionDiv);
            });

            card.appendChild(optionsContainer);
            card.appendChild(explanation);
            container.appendChild(card);
        });
    </script>
</body>
</html>
